name: CI - Testes Automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Executar testes Ruby (Cucumber)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🧰 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1' # ou a versão do seu projeto
          bundler-cache: true

      - name: 📦 Instalar dependências
        run: bundle install

      - name: ✅ Executar testes Cucumber
        run: bundle exec cucumber
