name: CI - Testes Automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Executar testes Ruby (Cucumber)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🧰 Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4' # ajuste conforme sua versão
          bundler-cache: true

      - name: 📦 Instalar dependências
        run: bundle install

      - name: 🗂️ Criar diretório para relatórios
        run: mkdir reports

      - name: ✅ Executar testes Cucumber com relatório HTML
        run: bundle exec cucumber --format html --out reports/report.html

      - name: 📤 Salvar artefato do relatório
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/report.html